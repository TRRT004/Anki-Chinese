services:
  anki-sync:
    build: .
    env_file: .env
    environment:
      - OUTPUT_DIR=/output
      - ANKI_COLLECTION_PATH=/collection
      - RUN_AS_DAEMON=true
    volumes:
      - ./output:/output
      - ./collection:/collection   # persistent collection for ankiweb backend
    restart: unless-stopped           # survive reboots; stop only on explicit `docker compose down`
